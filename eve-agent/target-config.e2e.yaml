# Container-scoped shadow of the target repo's .runtime-agent-cli.yaml
# (bind-mounted over it by the portfolio's docker-compose.e2e.yml).
# Inside a container "localhost" is the container itself; the fable engine
# is now IN the fable container (in-process A2A agent, promoted 2026-07-25)
# reachable at the compose hostname, not host.docker.internal.
openapi_source: "http://fable:2001/openapi.json"
environment: local
environments:
  local:
    base_url: "http://fable:2001"
