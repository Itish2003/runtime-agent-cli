name: Publish to npm

# Publishes on a version tag — bump package.json, then:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Auth: OIDC trusted publishing (no token, adds provenance). One-time setup on npmjs.com:
#   npmjs.com → the package → Settings → Trusted Publisher → GitHub Actions
#   Organization/user: Itish2003 · Repository: runtime-agent-cli · Workflow filename: publish.yml
# (Until that's configured, this workflow will fail to authenticate.)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for OIDC authentication + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: no `registry-url` — it writes an .npmrc with an empty _authToken
      # that shadows OIDC. npm defaults to registry.npmjs.org anyway.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted publishing requires a recent npm (>= 11.5.1).
      - run: npm install -g npm@latest

      # Safety: the git tag must match the version in package.json.
      - name: Verify tag matches package.json version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG  tag=$TAG"
          test "$PKG" = "$TAG"

      - run: npm publish
