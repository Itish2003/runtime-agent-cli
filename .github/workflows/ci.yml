name: CI

# Runs the same gates as publish.yml (typecheck + test), but on every push to
# main and on PRs — so regressions turn a PR red instead of blowing up a release
# you've already tagged. publish.yml re-runs these at tag time as the final gate.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The package ships raw .ts (files: ["src"]), so a type error reaches consumers
  # directly. bun build does NOT type-check — tsc is the only guard.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  # The suite pins the doctrine — §7 envelope, graceful degradation, diff
  # soundness, "cannot go stale" — so a regression can't land on main.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
